<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <style>
      .box { fill: #f4f7fb; stroke: #2a3a4a; stroke-width: 2; rx: 10; }
      .title { font: 16px 'Segoe UI', Arial, sans-serif; fill: #111827; font-weight: 600; }
      .text { font: 13px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .arrow { stroke: #2a3a4a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a3a4a" />
    </marker>
  </defs>

  <rect x="40" y="40" width="820" height="440" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" rx="14" />

  <rect class="box" x="80" y="90" width="230" height="90" />
  <text class="title" x="98" y="125">Webcam Frame</text>
  <text class="text" x="98" y="148">Posture feed + face ROI</text>

  <rect class="box" x="360" y="90" width="230" height="90" />
  <text class="title" x="378" y="125">Face Auth Engine</text>
  <text class="text" x="378" y="148">Detect, embed, score</text>

  <rect class="box" x="640" y="90" width="180" height="90" />
  <text class="title" x="658" y="125">Checks</text>
  <text class="text" x="658" y="148">Match + position</text>

  <rect class="box" x="140" y="250" width="260" height="100" />
  <text class="title" x="158" y="286">Presence Result</text>
  <text class="text" x="158" y="310">AUTHORIZED / UNKNOWN</text>
  <text class="text" x="158" y="330">ABSENT / LOW_QUALITY</text>

  <rect class="box" x="470" y="250" width="260" height="100" />
  <text class="title" x="488" y="286">UI + Policy</text>
  <text class="text" x="488" y="310">Lock overlay / alerts</text>
  <text class="text" x="488" y="330">Grace timers + logs</text>

  <rect class="box" x="280" y="390" width="340" height="90" />
  <text class="title" x="298" y="425">Monitoring Continuity</text>
  <text class="text" x="298" y="448">Pause tracking when locked</text>

  <line class="arrow" x1="310" y1="135" x2="360" y2="135" />
  <line class="arrow" x1="590" y1="135" x2="640" y2="135" />
  <line class="arrow" x1="730" y1="180" x2="600" y2="250" />
  <line class="arrow" x1="400" y1="180" x2="270" y2="250" />
  <line class="arrow" x1="400" y1="300" x2="470" y2="300" />
  <line class="arrow" x1="600" y1="350" x2="450" y2="390" />
</svg>
